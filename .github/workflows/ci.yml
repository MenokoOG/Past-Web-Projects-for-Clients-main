name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  newsbf-modern:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newsbf_Dreamweaver_test/newsbf-modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: newsbf_Dreamweaver_test/newsbf-modern/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
